<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RH Santíssimo Resort — Canal para ex-colaboradores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0d2318;
    --navy-900:#1d4430;
    --navy-800:#2a5940;
    --gold-500:#c9a227;
    --gold-300:#e3c766;
    --cream-050:#fbf8f0;
    --ink:#182234;
    --muted:#6b7688;
    --bubble-in:#ffffff;
    --bubble-out:#fdf3d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream-050);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .app-header{
    background:linear-gradient(135deg, var(--navy-900), var(--navy-800));
    color:#fff;
    padding:20px 20px;
    display:flex;align-items:center;gap:16px;
    flex:none;
    box-shadow:0 2px 10px rgba(10,26,47,0.15);
  }
  .avatar{
    width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--navy-800), var(--navy-950));
    border:2px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .avatar img{width:74%;height:74%;object-fit:contain;}
  .who .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;font-size:23px;line-height:1.15;
  }
  .who .status{
    font-size:12.5px;color:var(--gold-300);
    display:flex;align-items:center;gap:6px;margin-top:5px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex:none;}

  .chat-body{
    flex:1;overflow-y:auto;min-height:0;
    padding:18px 16px 10px;
    display:flex;flex-direction:column;gap:10px;
    max-width:720px;width:100%;margin:0 auto;
  }
  .chat-body::-webkit-scrollbar{width:5px;}
  .chat-body::-webkit-scrollbar-thumb{background:rgba(12,35,64,0.15);border-radius:10px;}

  .bubble{
    max-width:86%;
    padding:11px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.55;
    box-shadow:0 1px 2px rgba(10,26,47,0.05);
    white-space:pre-line;
  }
  .bubble.bot{
    align-self:flex-start;
    background:var(--bubble-in);
    color:var(--ink);
    border-top-left-radius:4px;
    border:1px solid rgba(12,35,64,0.06);
  }
  .bubble.bot .tag{
    display:block;font-size:11px;color:var(--gold-500);
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    margin-bottom:4px;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--bubble-out);
    color:var(--navy-950);
    border-top-right-radius:4px;
  }
  .bubble .time{
    display:block;text-align:right;
    font-size:10.5px;color:var(--muted);
    margin-top:5px;
  }

  .quick-replies{
    display:flex;flex-wrap:wrap;gap:7px;
    padding:2px 16px 12px;
    flex:none;
    max-width:720px;width:100%;margin:0 auto;
    box-sizing:border-box;
  }
  .chip{
    border:1px solid var(--navy-800);
    color:var(--navy-900);
    background:#fff;
    font-size:12.5px;
    padding:8px 13px;
    border-radius:18px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, color .15s;
  }
  .chip:hover{background:var(--navy-900); color:#fff;}
  .chip:active{transform:scale(0.98);}

  .composer-wrap{
    flex:none;
    background:var(--cream-050);
    border-top:1px solid rgba(12,35,64,0.08);
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .composer{
    display:flex;align-items:center;gap:10px;
    max-width:720px;width:100%;margin:0 auto;
  }
  .composer input{
    flex:1;
    border:1px solid rgba(12,35,64,0.15);
    background:#fff;
    border-radius:22px;
    padding:12px 16px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    color:var(--ink);
  }
  .composer input:focus{border-color:var(--gold-500);}
  .send-btn{
    width:42px;height:42px;border-radius:50%;
    background:var(--navy-900);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .send-btn svg{width:17px;height:17px;fill:var(--gold-300);}
  .send-btn:active{transform:scale(0.94);}

  .footer-note{
    text-align:center;font-size:10.5px;color:var(--muted);
    padding-top:12px;
  }
  .restart-btn{
    display:block;width:100%;
    background:#fff;
    border:2px solid var(--gold-500);
    color:var(--navy-900);
    font-size:15px;font-weight:700;
    font-family:inherit;
    padding:12px 20px;
    border-radius:24px;
    cursor:pointer;
    max-width:720px;margin:0 auto;
    transition:background .15s, color .15s;
  }
  .restart-btn:hover{background:var(--gold-500); color:#fff;}
  .restart-btn:active{transform:scale(0.98);}

  .typing{
    align-self:flex-start;
    background:var(--bubble-in);
    border:1px solid rgba(12,35,64,0.06);
    border-top-left-radius:4px;
    padding:11px 15px;border-radius:16px;
    display:flex;gap:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--navy-800);opacity:.5;
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:.9;}}
</style>
</head>

    </div>
  </div>

  <div class="chat-body" id="chatBody"></div>
  <div class="quick-replies" id="quickReplies"></div>

  <div class="composer-wrap">
    <div class="composer">
      <input id="msgInput" type="text" placeholder="Digite sua dúvida..." />
      <button class="send-btn" id="sendBtn" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <button class="restart-btn" id="resetBtn">🔄 Reiniciar conversa</button>
    <div class="footer-note">Departamento de Recursos Humanos · Santíssimo Resort</div>
  </div>

<script>
(function(){
  const chatBody = document.getElementById('chatBody');
  const quickWrap = document.getElementById('quickReplies');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  const WELCOME = "Olá! 👋 Este é o canal automático do *RH do Santíssimo Resort* para ex-colaboradores.\n\nPosso te ajudar agora mesmo com dúvidas sobre:";

  const QUICK = [
    {label:"Data da rescisão", key:"rescisao"},
    {label:"Devolução dos uniformes", key:"uniformes"},
    {label:"Exame demissional", key:"exame"},
    {label:"Quitação rescisória", key:"quitacao"},
    {label:"Seguro-desemprego", key:"seguro"},
    {label:"Devolução de bens corporativos", key:"bens"},
    {label:"Premiação (Check-in da Vitória)", key:"premiacao"},
    {label:"Falar com um analista", key:"humano"},
  ];

  const RULES = [
    {
      key:"rescisao",
      test:/rescis[aã]o|desligamento|demiss[aã]o|último dia|data.*sa[íi]da/i,
      tag:"Data da rescisão",
      reply:"Após o seu desligamento, ficam definidos três prazos importantes, todos contados a partir da data do seu comunicado:\n• *Entrega dos uniformes*\n• *Exame demissional*\n• *Quitação rescisória*\n\nEsse comunicado já está com você, assinado, e já traz essas datas marcadas para você comparecer."
    },
    {
      key:"uniformes",
      test:/uniforme/i,
      tag:"Devolução dos uniformes",
      reply:"A devolução dos uniformes antes da rescisão é fundamental. Verifique a data em seu documento e compareça ao Departamento de Recursos Humanos do Santíssimo Resort para a devolução."
    },
    {
      key:"quitacao",
      test:/quita[cç][aã]o|verbas|pagamento|acerto|tr[cç]t|dinheiro/i,
      tag:"Quitação rescisória",
      reply:"O prazo padrão para pagamento das verbas rescisórias (quitação) é de até *10 dias corridos* contados a partir do término do contrato, conforme Art. 477, §6º da CLT.\n\nA quitação será feita no dia indicado no comunicado assinado por você, no seguinte endereço:\nRua Frederico Ozanam, nº 345 D, bairro Pacú, Tiradentes, MG — escritório R&B.\n\nObs.: realize a devolução dos uniformes antes de comparecer a este endereço para a quitação rescisória."
    },
    {
      key:"exame",
      test:/exame demissional|exame médico|aso|medicina do trabalho/i,
      tag:"Exame demissional",
      reply:"O exame demissional é agendado pela Medicina do Trabalho e deve ocorrer *antes* da homologação da rescisão, dentro do prazo dos 10 dias corridos.\n\nO agendamento é enviado por mensagem, e-mail ou documento físico, sempre com a data marcada. Se ainda não recebeu, escreva *\"falar com analista\"*."
    },
    {
      key:"seguro",
      test:/seguro.?desemprego|guia do seguro/i,
      tag:"Seguro-desemprego",
      reply:"Quando aplicável, a guia do seguro-desemprego é emitida pelo DP junto com os demais documentos no dia da rescisão, dentro do mesmo prazo de 10 dias corridos.\n\nO requerimento em si é feito pelo colaborador no aplicativo ou site oficial da Carteira de Trabalho Digital, com essa guia em mãos."
    },
    {
      key:"bens",
      test:/bens corporativos|crach[aá]|not[eé]book|celular corporativo|chaves da empresa|equipamentos? da empresa/i,
      tag:"Devolução de bens corporativos",
      reply:"A devolução de bens corporativos (crachá, chaves, notebook, celular e equipamentos) ocorre no momento do seu desligamento da empresa."
    },
    {
      key:"premiacao",
      test:/premia[cç][aã]o|check-?in da vit[oó]ria|b[oô]nus/i,
      tag:"Premiação (Check-in da Vitória)",
      reply:"Sim, se você estiver dentro das regras da premiação do documento \"Check-in da Vitória\", as condições para estar apto dependem das regras e metas ali determinadas. Ok."
    },
    {
      key:"humano",
      test:/analista|humano|atendente|pessoa|rh mesmo|falar com alguém/i,
      tag:"Encaminhamento",
      reply:"Perfeito, encaminhe um e-mail para um analista do RH do Santíssimo Resort. Em breve alguém dará continuidade com as informações específicas do seu caso.\n\nE-mail: rh.ex@santissimoresort.com.br"
    },
  ];

  const FALLBACK = "Essa dúvida é específica do seu caso, então prefiro não arriscar uma resposta genérica. Já estou encaminhando para um analista do RH do Santíssimo Resort continuar com você por aqui.\n\nSe quiser, também pode escolher um dos temas abaixo.";

  function nowTime(){
    const d = new Date();
    return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }
  function scrollToBottom(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function addBubble({from, text, tag}){
    const div = document.createElement('div');
    div.className = 'bubble ' + (from === 'user' ? 'user' : 'bot');
    const tagHtml = tag ? '<span class="tag">'+tag+'</span>' : '';
    div.innerHTML = tagHtml + escapeHtml(text).replace(/\n/g,'<br>') + '<span class="time">'+nowTime()+'</span>';
    chatBody.appendChild(div);
    scrollToBottom();
  }
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    }).replace(/\*(.*?)\*/g, '<b>$1</b>');
  }
  function showTyping(callback, delay){
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(div);
    scrollToBottom();
    setTimeout(function(){
      const el = document.getElementById('typingIndicator');
      if(el) el.remove();
      callback();
    }, delay || 650);
  }
  function botReplyFor(text){
    const rule = RULES.find(r => r.test.test(text));
    if(rule){
      showTyping(function(){ addBubble({from:'bot', text:rule.reply, tag:rule.tag}); });
    } else {
      showTyping(function(){ addBubble({from:'bot', text:FALLBACK, tag:'Encaminhamento'}); });
    }
  }
  function handleUserMessage(text){
    if(!text.trim()) return;
    addBubble({from:'user', text:text});
    input.value = '';
    botReplyFor(text);
  }
  function renderQuickReplies(){
    quickWrap.innerHTML = '';
    QUICK.forEach(function(q){
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = q.label;
      btn.onclick = function(){ handleUserMessage(q.label); };
      quickWrap.appendChild(btn);
    });
  }
  function startConversation(){
    chatBody.innerHTML = '';
    addBubble({from:'bot', text:WELCOME, tag:'RH Santíssimo Resort'});
    renderQuickReplies();
  }

  sendBtn.addEventListener('click', function(){ handleUserMessage(input.value); });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') handleUserMessage(input.value); });
  resetBtn.addEventListener('click', startConversation);

  startConversation();
})();
</script>

</body>
</html>
